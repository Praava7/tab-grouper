<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Grouper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header__brand">
      <img src="icons/icon-48.png" alt="" class="header__logo" width="24" height="24" aria-hidden="true" />
      <span class="header__title">Tab Grouper</span>
    </div>
    <a
      href="#"
      id="settingsLink"
      class="header__settings"
      title="Open Settings"
      aria-label="Open Settings page"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- ── Overview ─────────────────────────────────────────────────────────── -->
  <section class="section" aria-labelledby="overviewHeading">
    <h2 class="section__heading" id="overviewHeading">Current Window</h2>
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-card__value" id="tabCount">—</span>
        <span class="stat-card__label">Tabs</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="groupCount">—</span>
        <span class="stat-card__label">Groups</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="ungroupedCount">—</span>
        <span class="stat-card__label">Ungrouped</span>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ── Quick Actions ─────────────────────────────────────────────────────── -->
  <section class="section" aria-labelledby="actionsHeading">
    <h2 class="section__heading" id="actionsHeading">Quick Actions</h2>
    <div class="actions-grid">
      <button class="btn btn--primary" id="btnGroupAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="4" rx="2"/>
          <rect x="2" y="10" width="20" height="4" rx="2"/>
          <rect x="2" y="17" width="20" height="4" rx="2"/>
        </svg>
        Group All Tabs
      </button>
      <button class="btn btn--ghost" id="btnUngroupAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Ungroup All
      </button>
      <button class="btn btn--secondary" id="btnCollapseAll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        <span id="collapseLabel">Collapse All</span>
      </button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ── Session Stash ─────────────────────────────────────────────────────── -->
  <section class="section" aria-labelledby="stashHeading">
    <h2 class="section__heading" id="stashHeading">
      Session Stash
      <span class="badge" id="stashBadge" hidden>Saved</span>
    </h2>
    <p class="section__hint">Save the current window's tab groups and restore them later.</p>
    <div class="actions-grid">
      <button class="btn btn--secondary" id="btnStash">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Stash Window
      </button>
      <button class="btn btn--ghost" id="btnRestore" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
        </svg>
        Restore Session
      </button>
    </div>
    <p class="stash-meta" id="stashMeta" hidden></p>
  </section>

  <!-- ── Toast notification ───────────────────────────────────────────────── -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Feedback Footer ──────────────────────────────────────────────────── -->
  <footer class="popup-footer">
    <a
      href="https://forms.gle/DHjCJLYGPdBtfDtZA"
      target="_blank"
      rel="noopener noreferrer"
      class="popup-footer__link"
      id="feedbackLink"
    >
      💡 Feedback &amp; Suggestions
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
